name: guardrail tests

# Guardrails are a strict subset of `pr.yml`'s `bun run test` step.
# We only run them on PRs (not on push to main) — the merged commit is
# already validated by `pr.yml`'s push trigger, so re-running the same
# specs here would just double the bill.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-inline-localized-labels:
    name: Guardrail — no inline Sinhala/Tamil outside dictionaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run no-inline-localized-labels guardrail
        run: bunx vitest run src/lib/__tests__/no-inline-localized-labels.test.ts --reporter=verbose

      - name: Run no-hardcoded-question-strings guardrail
        run: bunx vitest run src/lib/__tests__/no-hardcoded-question-strings.test.ts --reporter=verbose

      - name: Run codebook yes/no label fidelity
        run: bunx vitest run src/lib/__tests__/codebook-yes-no-labels.test.ts --reporter=verbose
