name: Nightly performance + accessibility

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-axe-audit:
    name: Lighthouse + axe + audit
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      APP_ENV: staging
      SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      TURNSTILE_SECRET: ${{ secrets.STAGING_TURNSTILE_SECRET }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ vars.STAGING_ADMIN_BOOTSTRAP_EMAIL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.STAGING_TURNSTILE_SITE_KEY }}
      ALLOW_TURNSTILE_BYPASS: "false"
    steps:
      - name: Validate staging configuration
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Set the STAGING_BASE_URL repository variable before enabling nightly performance checks."
            exit 1
          fi
          missing=""
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY TURNSTILE_SECRET ADMIN_BOOTSTRAP_EMAIL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            missing="$missing SUPABASE_DB_URL-or-SUPABASE_ACCESS_TOKEN"
          fi
          if [ -n "$missing" ]; then
            echo "Set the staging deploy-gate variables/secrets before enabling nightly DB checks:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lighthouse budgets
        run: bun run lighthouse:ci

      - name: Axe scan
        run: bun run test:a11y

      - name: Deploy preflight
        run: bun run deploy:preflight

      - name: DB smoke
        run: bun run smoke:db

      - name: Schema drift check
        run: bun run db:diff:check

      - name: Bun audit
        run: bun audit --audit-level=moderate

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/lighthouse
          retention-days: 14

      - name: Upload DB diff reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-diff-reports
          path: test-results/db-diff
          retention-days: 14
