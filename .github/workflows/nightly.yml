name: Nightly performance + accessibility

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-axe-audit:
    name: Lighthouse + axe + audit
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Validate staging URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Set the STAGING_BASE_URL repository variable before enabling nightly performance checks."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Lighthouse budgets
        run: bun run lighthouse:ci

      - name: Axe scan
        run: bun run test:a11y

      - name: Bun audit
        run: bun audit --audit-level=moderate

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/lighthouse
          retention-days: 14
