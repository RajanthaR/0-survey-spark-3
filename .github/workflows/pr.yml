name: PR checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

# Cancel any in-flight run on the same ref when a new commit lands.
# Saves ~5 min per superseded push on a feature branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, test, build, smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint -- --max-warnings 0

      - name: Service-role client import guard
        run: |
          hits="$(grep -RInE 'createAdminClient|supabaseAdmin' src --include='*.tsx' || true)"
          if [ -n "$hits" ]; then
            echo "Service-role Supabase clients must not be imported from client-rendered .tsx files."
            echo "$hits"
            exit 1
          fi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Start preview
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Smoke
        run: BASE_URL=http://127.0.0.1:4173 bun run smoke
