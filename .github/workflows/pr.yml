name: PR checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

# Cancel any in-flight run on the same ref when a new commit lands.
# Saves ~5 min per superseded push on a feature branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-failing static checks: typecheck + format + lint + service-role grep.
  # All five steps run sequentially in one job because they share `node_modules`
  # and most fail in <30 s, so an early failure aborts the slow `test` and
  # `build` jobs (via the implicit GitHub Actions UI status — both jobs run
  # in parallel; reviewers can read whichever finished first).
  static:
    name: Static (typecheck + format + lint + service-role grep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint -- --max-warnings 0

      - name: Deploy preflight static fixture
        run: bun run deploy:preflight:static

      - name: Service-role client import guard
        run: |
          hits="$(grep -RInE 'createAdminClient|supabaseAdmin' src --include='*.tsx' || true)"
          if [ -n "$hits" ]; then
            echo "Service-role Supabase clients must not be imported from client-rendered .tsx files."
            echo "$hits"
            exit 1
          fi

  # Parallel with `static` and `build`. Vitest is the slowest single step
  # (~90 s) so it stays in its own job for clean failure isolation.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Upload same-as-English i18n report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-as-english-i18n
          path: coverage/same-as-english.json
          retention-days: 14

  # Parallel with `static` and `test`. Smoke moved to `smoke.yml`
  # (push: main only) — see that workflow for the deploy-gate rationale.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  bundle:
    name: Bundle budgets + shape
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Size budgets
        run: bun run size

      - name: Respondent bundle shape
        run: bun run bundle:shape

  a11y:
    name: Axe critical routes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Start preview
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Axe scan
        run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 bun run test:a11y

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-preview-log
          path: preview.log
          retention-days: 7
