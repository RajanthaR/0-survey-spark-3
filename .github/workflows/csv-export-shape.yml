name: csv-export-shape tests

# This is a strict subset of `pr.yml`'s `bun run test` step. We keep it
# as a fast pre-check on PR pushes; we do NOT also run it on push-to-main
# because the merged commit is already validated by `pr.yml`'s push job.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "audits/**"
      - "Codex-audits/**"
      - "Plans/**"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run csv-export-shape suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run csv-export-shape test suite
        run: bunx vitest run src/lib/__tests__/csv-export-shape.test.ts --reporter=verbose
